# ============================================================
# application-docker.yaml - Docker profile
# ============================================================
# Used when the backend runs INSIDE a Docker container.
#
# Key difference from 'local' profile:
#   - Database host is 'postgres' (the Docker container name)
#     instead of 'localhost'
#   - All values come from environment variables (${...})
#     which are injected by docker-compose.yml
#
# The ${VAR:default} syntax means:
#   "Use the environment variable VAR if it exists,
#    otherwise fall back to 'default'"
# ============================================================

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/vaultpay}
    username: ${SPRING_DATASOURCE_USERNAME:vaultpay}
    password: ${SPRING_DATASOURCE_PASSWORD:vaultpay}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: smtp.gmail.com
    port: 587
    username: noreply@vaultpay.com
    password: changeme
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET:VaultPaySuperSecretKeyThatIsAtLeast256BitsLongForHMACSHA256Algorithm!!}
  expiration-ms: 86400000

server:
  port: 8080
