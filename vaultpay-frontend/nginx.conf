# ============================================================
# nginx Configuration for VaultPay Frontend
# ============================================================
# This config does two things:
#
# 1. SERVES the React app (static HTML/CSS/JS files)
#    - try_files $uri $uri/ /index.html
#    - This is critical for SPAs (Single Page Applications)!
#    - Without it, refreshing on /dashboard would show "404"
#    - because there's no actual file called "dashboard"
#    - Instead, nginx serves index.html and React handles the routing
#
# 2. PROXIES API requests to the backend
#    - Any request to /api/* gets forwarded to the backend container
#    - The browser thinks it's talking to the same server (no CORS issues!)
# ============================================================

server {
    listen 80;
    server_name localhost;

    # Serve React static files
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy — forward /api/* requests to the backend container
    # "backend" is the Docker service name defined in docker-compose.yml
    # Docker's internal DNS resolves "backend" to the container's IP
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse proxy for Swagger UI (API documentation)
    location /swagger-ui/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location /v3/api-docs {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # Cache static assets for better performance
    # CSS, JS, images rarely change — cache them for 1 year
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
